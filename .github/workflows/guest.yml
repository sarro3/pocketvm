name: Build Android 9 guest image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ci/build_android_guest.py'
      - '.github/workflows/guest.yml'

concurrency:
  group: guest-image
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev kmod

      - name: Restore guest work cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/pocketvm-guest
          key: guest-android9-${{ github.sha }}
          # Prefer an Android 9 cache; fall back to the older Android 12 cache
          # (kernel + Debian rootfs are reusable — the build script wipes the
          # stale redroid 12 userspace when the tag no longer matches).
          restore-keys: |
            guest-android9-
            guest-kernel-

      - name: Build Android 9 guest image
        run: |
          set -o pipefail
          sudo -E GITHUB_TOKEN="$GITHUB_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" \
            bash -c 'python3 ci/build_android_guest.py 2>&1 | tee guest.log'

      - name: Prune work dir before cache save
        if: always()
        run: |
          # Keep blobs: re-downloading redroid layers each run is slow and flaky.
          sudo rm -rf /mnt/pocketvm-guest/rootfs.img /mnt/pocketvm-guest/rootfs.img.gz /mnt/pocketvm-guest/out-guest || true
          du -sh /mnt/pocketvm-guest || true

      - name: Save guest work cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/pocketvm-guest
          key: guest-android9-${{ github.sha }}

      - name: Publish release asset
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android9-v${{ github.run_number }}"
          ZIP=$(ls out-guest/*.zip | head -1)
          cp "$ZIP" out-guest/pocketvm-android9-arm64.zip
          echo "publishing out-guest/pocketvm-android9-arm64.zip as $TAG"
          gh release create "$TAG" out-guest/pocketvm-android9-arm64.zip \
            --title "Android 9 guest image (v${{ github.run_number }})" \
            --notes "Prebuilt Android 9 (redroid) arm64 guest for PocketVM: rootfs.ext4 (gz) + Linux kernel. Import from the app: New VM → Download Android 9 guest image." \
            || gh release upload "$TAG" out-guest/pocketvm-android9-arm64.zip --clobber

      - name: Publish build link to ci-latest-guest branch
        if: always()
        run: |
          { echo "guest_release=https://github.com/${{ github.repository }}/releases/tag/android9-v${{ github.run_number }}";
            echo "asset=$(ls out-guest/*.zip 2>/dev/null | head -1)";
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } > guestlink.txt
          git config user.email "ci@pocketvm.local"
          git config user.name "pocketvm-ci"
          git checkout -q -B ci-latest-guest
          git add -f guestlink.txt
          git commit -qm "guest build link (run ${{ github.run_number }})" || true
          git push -q -f origin ci-latest-guest

      - name: Publish error log to ci-error-guest branch
        if: failure()
        run: |
          tail -c 200000 guest.log > guesterr.txt 2>/dev/null || echo "no guest.log" > guesterr.txt
          git config user.email "ci@pocketvm.local"
          git config user.name "pocketvm-ci"
          git checkout -q -B ci-error-guest
          git add -f guesterr.txt
          git commit -qm "guest ci error tail (run $GITHUB_RUN_ID)" || true
          git push -q -f origin ci-error-guest
